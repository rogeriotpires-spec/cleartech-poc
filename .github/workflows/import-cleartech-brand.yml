name: Preparar logomarca oficial

on:
  push:
    paths:
      - '.github/workflows/import-cleartech-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copiar e validar logomarca do site institucional
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          source = 'https://www.cleartech.com.br/wp-content/themes/cleartech/assets/images/logo.svg'
          req = urllib.request.Request(source, headers={'User-Agent': 'Cleartech-PoC-brand-import'})
          with urllib.request.urlopen(req, timeout=45) as response:
              data = response.read(300001)
          if len(data) > 300000 or b'<!DOCTYPE' in data.upper() or b'<!ENTITY' in data.upper():
              raise RuntimeError('Arquivo SVG fora dos limites permitidos.')
          root = ET.fromstring(data)
          if root.tag.split('}')[-1] != 'svg':
              raise RuntimeError('A origem não retornou uma imagem SVG.')
          for element in root.iter():
              if element.tag.split('}')[-1].lower() in ('script', 'foreignobject'):
                  raise RuntimeError('Elemento ativo não permitido no SVG.')
              for key, value in element.attrib.items():
                  name = key.lower().split('}')[-1]
                  if name.startswith('on') or 'javascript:' in value.lower():
                      raise RuntimeError('Conteúdo ativo não permitido no SVG.')
                  if name == 'href' and value and not value.startswith('#'):
                      if not value.startswith('data:image/png;base64,'):
                          raise RuntimeError('Referência externa não permitida no SVG.')
                      image = base64.b64decode(value.split(',', 1)[1])
                      if not image.startswith(b'\x89PNG\r\n\x1a\n'):
                          raise RuntimeError('Imagem incorporada inválida.')
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'Cleartech-PoC-brand-import',
          }
          endpoint = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/contents/assets/cleartech-logo.svg'
          body = {
              'message': 'Adiciona logomarca oficial Cleartech, sem dependência externa no portal',
              'content': base64.b64encode(data).decode('ascii'),
              'branch': os.environ['GH_BRANCH'],
          }
          try:
              request = urllib.request.Request(endpoint + '?ref=' + os.environ['GH_BRANCH'], headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body['sha'] = json.load(response)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          request = urllib.request.Request(endpoint, data=json.dumps(body).encode(), headers=headers, method='PUT')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          print('Logomarca oficial validada:', len(data), 'bytes')
          print('SHA-256:', hashlib.sha256(data).hexdigest())
          print('Arquivo:', result['content']['path'])
          print('Commit:', result['commit']['sha'])
          PY
